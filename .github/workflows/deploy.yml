name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: app
        run: pnpm build

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build

      - name: Merge docs into app dist
        run: cp -r docs/dist app/dist/docs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/dist

  deploy-ghpages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-bunny:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/bunny

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to bunny.net
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
          BUNNY_ACCOUNT_API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
        run: bash deploy/bunny/deploy.sh site
