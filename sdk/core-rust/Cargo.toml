[package]
name = "spryte-cvm-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Spryte CVM generation — shared via UniFFI bindings for Kotlin + Swift"

[dependencies]
nostr-sdk = { version = "0.39", features = ["nip44"] }
uniffi = { version = "0.28", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"


[lib]
crate-type = ["lib", "cdylib", "staticlib"]
